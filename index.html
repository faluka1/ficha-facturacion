<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ficha de Datos para Facturación · Impulso Virtual</title>
<style>
  :root{
    --purple: #5b3fd6;
    --purple-dark: #3d2a99;
    --teal: #4fd8d0;
    --ink: #241a4a;
    --card: #eaf6fb;
    --line: #6a5fc7;
    --paper: #ffffff;
  }
  *{ box-sizing: border-box; }
  body{
    margin:0;
    font-family: 'Segoe UI', Tahoma, Arial, sans-serif;
    background: linear-gradient(135deg, var(--purple) 0%, var(--purple) 35%, var(--teal) 100%);
    min-height:100vh;
    display:flex;
    justify-content:center;
    padding: 28px 12px;
  }
  .stamp{
    position:relative;
    width:100%;
    max-width:480px;
    background: var(--card);
    border-radius: 6px;
    padding: 26px 22px 20px;
    box-shadow: 0 20px 50px rgba(30,10,70,.35);
  }
  /* scalloped border effect */
  .stamp::before{
    content:"";
    position:absolute;
    inset:-14px;
    border-radius: 14px;
    background:
      radial-gradient(circle 10px at 0 0, transparent 9px, var(--card) 10px) 0 0/28px 28px repeat-x,
      radial-gradient(circle 10px at 0 0, transparent 9px, var(--card) 10px) 0 100%/28px 28px repeat-x,
      radial-gradient(circle 10px at 0 0, transparent 9px, var(--card) 10px) 0 0/28px 28px repeat-y,
      radial-gradient(circle 10px at 0 0, transparent 9px, var(--card) 10px) 100% 0/28px 28px repeat-y;
    z-index:-1;
    display:none;
  }
  .brand{
    text-align:center;
    font-weight:700;
    color: var(--purple-dark);
    letter-spacing:.5px;
    margin-bottom: 10px;
    font-size: 13px;
  }
  .brand span{ color:#c04fbf; }
  h1{
    font-family: Georgia, 'Times New Roman', serif;
    text-align:center;
    font-size: 22px;
    color: var(--ink);
    margin: 0 0 18px;
  }
  h1 em{ font-style: normal; color: var(--purple); }
  .panel{
    background: var(--paper);
    border-radius: 4px;
    padding: 20px 18px 26px;
  }
  .panel h2{
    color: var(--purple-dark);
    font-size: 13px;
    letter-spacing:.4px;
    margin: 0 0 16px;
  }
  label{
    display:block;
    font-size: 12px;
    font-weight:700;
    color: var(--purple-dark);
    margin-top: 14px;
    margin-bottom: 4px;
  }
  input[type=text], textarea{
    width:100%;
    border:none;
    border-bottom: 1px solid var(--line);
    background: transparent;
    font-size: 14px;
    color: var(--ink);
    padding: 4px 2px 6px;
    font-family: inherit;
    resize: none;
  }
  input[type=text]:focus, textarea:focus{
    outline:none;
    border-bottom: 2px solid var(--purple);
  }
  textarea{ height: 90px; line-height: 1.6; }
  .footer{
    margin-top: 18px;
    text-align:center;
    background: var(--purple-dark);
    color:#fff;
    font-size:12px;
    font-weight:600;
    padding: 8px 10px;
    border-radius: 3px;
  }
  .footer span{ color: var(--teal); }
  .actions{
    max-width:480px;
    width:100%;
    margin-top: 16px;
    display:flex;
    gap:10px;
    flex-wrap:wrap;
    justify-content:center;
  }
  button{
    border:none;
    cursor:pointer;
    font-family:inherit;
    font-weight:700;
    font-size: 13px;
    padding: 11px 16px;
    border-radius: 8px;
    transition: transform .1s ease, opacity .15s ease;
  }
  button:active{ transform: scale(.97); }
  #btnWhatsapp{ background:#25D366; color:#06331d; }
  #btnPdf{ background:#fff; color: var(--purple-dark); }
  #btnClear{ background: rgba(255,255,255,.25); color:#fff; }
  .toast{
    position: fixed;
    bottom: 20px;
    left:50%;
    transform: translateX(-50%);
    background: var(--ink);
    color:#fff;
    padding: 10px 18px;
    border-radius: 8px;
    font-size: 13px;
    opacity:0;
    pointer-events:none;
    transition: opacity .25s ease;
  }
  .toast.show{ opacity:1; }

  @media print{
    body{ background: none; padding:0; }
    .actions, .toast{ display:none !important; }
    .stamp{ box-shadow:none; max-width:100%; }
    input[type=text], textarea{ border-bottom: 1px solid #999; }
  }
</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
</head>
<body>

<div style="display:flex; flex-direction:column; align-items:center; width:100%;">

  <div class="stamp" id="ficha">
    <div class="brand">IMPULSO <span>VIRTUAL</span></div>
    <h1>FICHA DATOS PARA <em>FACTURACIÓN</em></h1>

    <div class="panel">
      <h2>DATOS DEL COMPROBANTE</h2>

      <label for="ruc">RUC</label>
      <input type="text" id="ruc" placeholder="Ingresa el RUC">

      <label for="razon">RAZÓN SOCIAL</label>
      <input type="text" id="razon" placeholder="Nombre de la empresa">

      <label for="descripcion">DESCRIPCIÓN</label>
      <textarea id="descripcion" placeholder="Detalle del producto o servicio"></textarea>

      <label for="monto">MONTO TOTAL</label>
      <input type="text" id="monto" placeholder="S/ 0.00">

      <label for="condicion">CONDICIÓN</label>
      <input type="text" id="condicion" placeholder="Contado / Crédito">
    </div>

    <div class="footer">El Impulso que tu negocio <span>necesita</span></div>
  </div>

  <div class="actions">
    <button id="btnWhatsapp">✅ Copiar/Enviar a WhatsApp</button>
    <button id="btnImagen">🖼️ Enviar como imagen</button>
    <button id="btnClear">🗑️ Limpiar</button>
  </div>

</div>

<div class="toast" id="toast"></div>

<script>
function showToast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(()=> t.classList.remove('show'), 2200);
}

function buildTexto(){
  const ruc = document.getElementById('ruc').value.trim() || '-';
  const razon = document.getElementById('razon').value.trim() || '-';
  const descripcion = document.getElementById('descripcion').value.trim() || '-';
  const monto = document.getElementById('monto').value.trim() || '-';
  const condicion = document.getElementById('condicion').value.trim() || '-';

  return `*FICHA DE DATOS PARA FACTURACIÓN*
_Impulso Virtual_

*RUC:* ${ruc}
*Razón social:* ${razon}
*Descripción:* ${descripcion}
*Monto total:* ${monto}
*Condición:* ${condicion}`;
}

document.getElementById('btnWhatsapp').addEventListener('click', async () => {
  const texto = buildTexto();

  try{
    await navigator.clipboard.writeText(texto);
  }catch(e){
    // fallback
    const ta = document.createElement('textarea');
    ta.value = texto;
    document.body.appendChild(ta);
    ta.select();
    document.execCommand('copy');
    document.body.removeChild(ta);
  }

  showToast('Copiado ✅ Abriendo WhatsApp...');
  const url = 'https://wa.me/?text=' + encodeURIComponent(texto);
  window.open(url, '_blank');
});

document.getElementById('btnImagen').addEventListener('click', async () => {
  showToast('Generando imagen...');
  try{
    const nodo = document.getElementById('ficha');
    const canvas = await html2canvas(nodo, { backgroundColor: null, scale: 2 });

    canvas.toBlob(async (blob) => {
      const archivo = new File([blob], 'ficha-facturacion.png', { type: 'image/png' });

      if (navigator.canShare && navigator.canShare({ files: [archivo] })){
        try{
          await navigator.share({
            files: [archivo],
            title: 'Ficha de datos para facturación'
          });
          return;
        }catch(e){
          // si el usuario cancela el share, no hacemos nada más
          if (e.name === 'AbortError') return;
        }
      }

      // Fallback (PC / navegadores sin soporte de compartir archivos)
      const link = document.createElement('a');
      link.href = URL.createObjectURL(blob);
      link.download = 'ficha-facturacion.png';
      link.click();
      showToast('Imagen descargada. Adjúntala en WhatsApp 📎');
    }, 'image/png');

  }catch(err){
    showToast('No se pudo generar la imagen');
  }
});

document.getElementById('btnClear').addEventListener('click', () => {
  ['ruc','razon','descripcion','monto','condicion'].forEach(id=>{
    document.getElementById(id).value = '';
  });
  showToast('Formulario limpiado');
});
</script>

</body>
</html>
